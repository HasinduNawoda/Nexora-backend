spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexora_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=update
spring.application.name=backend
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
jwt.secret=${JWT_SECRET:}
admin.default-username=${ADMIN_USERNAME:admin}
admin.default-password=${ADMIN_PASSWORD:}

# Gmail OAuth2
gmail.client-id=${GMAIL_CLIENT_ID:}
gmail.client-secret=${GMAIL_CLIENT_SECRET:}
gmail.redirect-uri=${GMAIL_REDIRECT_URI:http://localhost:8080/api/admin/gmail/callback}
gmail.token-encryption-key=${GMAIL_TOKEN_ENCRYPTION_KEY:}
gmail.frontend-redirect=${GMAIL_FRONTEND_REDIRECT:http://localhost:5173/admin/news}